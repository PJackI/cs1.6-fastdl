// Use this file to configure your DEDICATED server. 
// This config file is executed on server start.

// disable autoaim
sv_aim 0

// disable clients' ability to pause the server
pausable 0

// default server name. Change to "Bob's Server", etc.
hostname "[RS] Zombie Escape - Revenant Souls [Summer Update] [FDL/Free VIP]"

// 20 minute timelimit
mp_timelimit 20

sv_cheats 0

// load ban files
exec listip.cfg
exec banned.cfg

sv_airaccelerate 150
sv_accelerate 10
sv_force_ent_intersection 1
mp_auto_join_team 1

sv_allowdownload 1
sv_allowupload 1
sv_downloadurl "https://pjacki.github.io/cs1.6-fastdl/cstrike/"